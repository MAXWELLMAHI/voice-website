<style>

</style></head><body class="loading"><div class="loader" role="dialog" aria-label="Enter Site" aria-modal="true"><div class="loader-inner"><svg class="loader-logo" viewBox="0 0 60 76" fill="none" aria-hidden="true"><path d="M5 8 30 67 55 8M15 8 30 46 45 8M25 8 30 22 35 8" stroke-width="1.1"/></svg><div class="loader-word">VOICE</div><div class="loader-sub">Mumbai · Chawl Edition</div><div class="track" role="progressbar" aria-label="Loading video" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar"></div></div><div class="meta"><span>LOADING THE NIGHT</span><span id="percent">00%</span></div><button class="enter" disabled>Enter Site ↗</button></div><div class="loader-foot">Built in the Noise.</div></div>

<button class="sound-toggle" type="button" aria-label="Mute video sound" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" stroke="currentColor" stroke-width="1.3"/><path class="sound-waves" d="M17 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14" stroke="currentColor" stroke-width="1.3"/><path class="sound-cross" d="m17 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="1.3"/></svg><span>Sound on</span></button>
<video id="city-video" playsinline loop preload="auto" style="display:none" src="__VIDEO_DATA__"></video>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
(()=>{'use strict';const EMBED=new URLSearchParams(location.search).has('embed'),REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches,$=s=>document.querySelector(s),video=$('#city-video'),stage=$('#stage'),canvas=$('#scene'),mouse={x:0,y:0},state={progress:0,intro:1.4};let entered=false,active=true,readyDone=false,plane,renderer,camera,scene,texture,lastFrame=0;const mobile=()=>innerWidth<700;let seed=17;function rand(){seed=seed*16807%2147483647;return(seed-1)/2147483646;}if(EMBED)document.body.classList.add('embedded');
const grain=document.createElement('canvas');grain.width=grain.height=100;const ctx=grain.getContext('2d'),pixels=ctx.createImageData(100,100);for(let i=0;i<pixels.data.length;i+=4){const n=rand()*255;pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=n;pixels.data[i+3]=170;}ctx.putImageData(pixels,0,0);$('.grain').style.backgroundImage=`url(${grain.toDataURL()})`;
function send(data){if(EMBED)parent.postMessage({voice:true,...data},location.origin==='null'?'*':location.origin);}
function progress(n){if(readyDone&&n<100)return;$('.bar').style.transform=`scaleX(${n/100})`;$('#percent').textContent=n+'%';$('.track').setAttribute('aria-valuenow',n);}
function ready(){if(readyDone)return;readyDone=true;progress(100);$('.enter').disabled=false;$('.loader').classList.add('is-ready');stage.dataset.ready='true';send({ready:true});}
function seek(p){gsap.to(state,{progress:Math.max(0,Math.min(1,p)),duration:REDUCED?0:.65,ease:'power3.out',overwrite:'auto'});}
function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,mobile()?1.5:2));renderer.setSize(innerWidth,innerHeight);const viewHeight=2*14*Math.tan(THREE.MathUtils.degToRad(42/2)),scale=Math.max(viewHeight/9,viewHeight*camera.aspect/16)*1.08;plane.scale.setScalar(scale);canvas.dataset.pixelRatio=String(renderer.getPixelRatio());}
try{scene=new THREE.Scene();scene.background=new THREE.Color(0x080f1c);camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,80);renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'low-power'});renderer.outputEncoding=THREE.sRGBEncoding;const poster=new THREE.TextureLoader().load('__POSTER_DATA__',()=>{progress(75);if(video.readyState>=2)ready();});poster.encoding=THREE.sRGBEncoding;const geo=new THREE.PlaneGeometry(16,9,48,16),pos=geo.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i);pos.setZ(i,-Math.pow(x/8,2)*.85);}geo.computeVertexNormals();const mat=new THREE.MeshBasicMaterial({map:poster,color:0xd2d9e5,toneMapped:false});plane=new THREE.Mesh(geo,mat);scene.add(plane);texture=new THREE.VideoTexture(video);texture.encoding=THREE.sRGBEncoding;texture.minFilter=THREE.LinearFilter;texture.magFilter=THREE.LinearFilter;function videoReady(){mat.map=texture;mat.needsUpdate=true;stage.dataset.video='ready';ready();}video.addEventListener('loadeddata',videoReady,{once:true});if(video.readyState>=2)videoReady();progress(40);canvas.dataset.three=THREE.REVISION;canvas.dataset.gsap=gsap.version;
// Sparse particles occupy a separate depth plane; the supplied film remains the scene.
const count=mobile()?22:48,points=new Float32Array(count*3);for(let i=0;i<count;i++){points[i*3]=(rand()-.5)*22;points[i*3+1]=(rand()-.5)*13;points[i*3+2]=1+rand()*4;}const starsGeo=new THREE.BufferGeometry();starsGeo.setAttribute('position',new THREE.BufferAttribute(points,3));const stars=new THREE.Points(starsGeo,new THREE.PointsMaterial({size:.012,color:0xd9e0ed,transparent:true,opacity:.22,depthWrite:false}));scene.add(stars);resize();let frames=0,fpsTime=performance.now();function draw(t){requestAnimationFrame(draw);if(document.hidden||!active||(mobile()&&t-lastFrame<32))return;lastFrame=t;const p=state.progress;camera.position.set(REDUCED?0:mouse.x,REDUCED?0:mouse.y,14+state.intro-(REDUCED?0:p*1.25));camera.lookAt(0,0,0);if(!REDUCED){stars.rotation.z=Math.sin(t*.00003)*.015;stars.position.y=Math.sin(t*.00012)*.06;}renderer.render(scene,camera);frames++;if(t-fpsTime>1500){canvas.dataset.fps=String(Math.round(frames*1000/(t-fpsTime)));frames=0;fpsTime=t;}}requestAnimationFrame(draw);addEventListener('resize',resize);addEventListener('pointermove',e=>{if(!mobile()&&!REDUCED)gsap.to(mouse,{x:(e.clientX/innerWidth-.5)*.6,y:-(e.clientY/innerHeight-.5)*.25,duration:1.5,ease:'power3.out',overwrite:true});},{passive:true});}catch(e){stage.dataset.fallback='poster';console.error('Video depth unavailable',e);ready();}
video.addEventListener('error',()=>{stage.dataset.video='poster-fallback';ready();});setTimeout(ready,6500);
function paintSound(){const b=$('.sound-toggle');b.classList.toggle('is-muted',video.muted);b.setAttribute('aria-label',video.muted?'Unmute video sound':'Mute video sound');b.setAttribute('aria-pressed',String(video.muted));b.querySelector('span').textContent=video.muted?'Sound off':'Sound on';}
function playVideo(){video.play().catch(()=>{video.muted=true;paintSound();video.play().catch(()=>stage.dataset.video='poster-fallback');});}
function enterSite(){if(entered)return;entered=true;document.body.classList.remove('loading');send({enter:true});video.muted=false;video.volume=1;paintSound();playVideo();gsap.to('.loader',{autoAlpha:0,duration:REDUCED?.1:.9,ease:'power3.out',onComplete:()=>$('.loader')?.remove()});gsap.to(state,{intro:0,duration:REDUCED?0:2.8,ease:'power3.out'});gsap.from('.mast,.bottom,.sound-toggle',{autoAlpha:0,delay:.6,duration:1.5,ease:'power3.out'});}
$('.enter').addEventListener('click',enterSite);$('.sound-toggle').addEventListener('click',()=>{video.muted=!video.muted;paintSound();if(entered)playVideo();});
if(EMBED){addEventListener('message',e=>{if(e.source!==parent||!e.data?.voiceParent)return;if(e.data.enter)enterSite();if(Number.isFinite(e.data.progress))seek(e.data.progress);if(typeof e.data.active==='boolean'){active=e.data.active;if(!active)video.pause();else if(entered)playVideo();}});addEventListener('wheel',e=>{if(entered){e.preventDefault();send({wheel:e.deltaY});}},{passive:false});let y=0;addEventListener('touchstart',e=>y=e.touches[0].clientY,{passive:true});addEventListener('touchmove',e=>{if(entered){const next=e.touches[0].clientY;send({wheel:y-next});y=next;e.preventDefault();}},{passive:false});}else{gsap.registerPlugin(ScrollTrigger);ScrollTrigger.create({trigger:'.journey',start:'top top',end:'bottom bottom',onUpdate:s=>seek(s.progress)});}
$('.scroll').addEventListener('click',()=>{if(EMBED)send({scrollTo:1});else window.scrollTo({top:innerHeight*.6,behavior:REDUCED?'instant':'smooth'});});$('.brand')?.addEventListener('click',e=>{e.preventDefault();if(EMBED)send({scrollTo:0});else scrollTo({top:0,behavior:'smooth'});});})();
