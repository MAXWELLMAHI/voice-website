<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life in Mumbai — Depth Study</title>
<link rel="stylesheet" href="/assets/site-typography.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:clip;background:#071c22;color:#eee5d8}
.stage{position:fixed;inset:0;overflow:clip;isolation:isolate}
.ambient{position:absolute;inset:0;z-index:-4;background:url('/assets/mumbai/life-in-mumbai.jpg') center/cover no-repeat;filter:blur(25px) brightness(.38) saturate(.85);transform:scale(1.04)}
.atmosphere{position:absolute;inset:0;z-index:-3;background:radial-gradient(ellipse at 50% 48%,#09212900 20%,#07181cb3 80%),linear-gradient(180deg,#07191b70,transparent 30%,#051318b3);pointer-events:none}
.fallback{position:absolute;left:50%;top:50%;height:var(--art-height,80vh);width:var(--art-width,53.33vh);transform:translate(-50%,-50%);object-fit:contain;z-index:-2;transition:opacity .5s}
.webgl-ready .fallback{opacity:0}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 100px #020b1238}
.annotation{position:absolute;left:30px;top:27px;font:12px 'Borel',cursive;color:#e2d2bbbd;letter-spacing:0;pointer-events:none}
.caption{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:min(90%,380px);text-align:center;pointer-events:none}
.phase-counter{display:flex;gap:12px;justify-content:center;align-items:center;font:8px 'ABeeZee',Arial,sans-serif;letter-spacing:.18em;color:#a1b3b7}
.phase-counter:before,.phase-counter:after{content:'';height:1px;width:25px;background:#bdd3d338}
.phase-text{font:400 clamp(24px,3vw,38px)/1.1 'Cormorant SC',Georgia,serif;margin:13px 0 0;color:#f0e6d5;text-shadow:0 2px 18px #031014}
.perspective-note{position:absolute;right:28px;top:29px;font:8px 'ABeeZee',Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a9b7b584;pointer-events:none}
@media(min-width:1000px),(min-width:700px) and (max-height:600px){.caption{left:auto;right:4.5%;top:50%;bottom:auto;transform:translateY(-50%);width:18%;max-width:260px}.phase-text{font-size:clamp(27px,2.8vw,42px);line-height:1.18}}
@media(max-width:600px){.annotation{top:23px;left:22px;font-size:10px}.perspective-note{font-size:6px;right:22px;top:25px;letter-spacing:.1em}.caption{bottom:32px}.phase-text{font-size:27px;margin-top:11px}.phase-counter{font-size:7px}}
@media(prefers-reduced-motion:reduce){.fallback{transition:none}}
</style>
</head>
<body>
<main class="stage" id="alley-stage" aria-label="An immersive perspective of the supplied Mumbai alley illustration">
  <div class="ambient" aria-hidden="true"></div>
  <div class="atmosphere" aria-hidden="true"></div>
  <img class="fallback" src="/assets/mumbai/life-in-mumbai.jpg" width="640" height="960" alt="An illustrated Mumbai alley between detailed buildings, balconies and rooftops">
  <canvas id="alley-canvas" aria-label="Mumbai alley with a subtle three-dimensional perspective illusion"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="annotation">Life in Mumbai</div>
  <div class="perspective-note">Move gently. Look a little deeper.</div>
  <div class="caption" aria-live="off">
    <div class="phase-counter"><span id="phase-index">01</span><span>/ 03</span></div>
    <h2 class="phase-text">Don't Pill Up</h2>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(()=>{
  'use strict';
  const EMBED=new URLSearchParams(location.search).has('embed');
  const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas=document.getElementById('alley-canvas');
  const stage=document.getElementById('alley-stage');
  const caption=document.querySelector('.phase-text');
  const words=["Don't Pill Up",'Respect Your Body','Sleep Well'];
  const motion={x:0,y:0,progress:0};
  let active=!EMBED,firstFrame=true,phase=0,renderer,camera,scene,artwork,lastFrame=0;
  const BASE_Z=8,BASE_FOV=42,BASE_HEIGHT=6;
  const send=data=>{if(EMBED)parent.postMessage({mumbaiAlley:true,...data},location.origin);};
  const smooth=(a,b,t)=>{t=Math.max(0,Math.min(1,(t-a)/(b-a)));return t*t*(3-2*t);};

  function fitArtwork(){
    const w=innerWidth,h=innerHeight;
    const sideCaption=w>=1000||(w>=700&&h<600);
    const maxH=Math.min(h*(sideCaption?.92:.82),960*.94,(w-32)/(640/960));
    stage.style.setProperty('--art-height',maxH+'px');
    stage.style.setProperty('--art-width',(maxH*640/960)+'px');
    if(!renderer||!artwork)return;
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio,w<700?1.5:2));
    renderer.setSize(w,h);
    // Pixel sizing is based on the supplied image, with room for the dolly zoom.
    const viewHeight=2*BASE_Z*Math.tan(THREE.MathUtils.degToRad(BASE_FOV/2));
    const imageScale=maxH/h*viewHeight/BASE_HEIGHT;
    artwork.scale.set(imageScale,imageScale,1);
    canvas.dataset.artHeight=String(Math.round(maxH));
    canvas.dataset.pixelRatio=String(renderer.getPixelRatio());
    firstFrame=true;
  }

  function updateProgress(p){
    p=Math.max(0,Math.min(1,p));
    gsap.to(motion,{progress:p,duration:REDUCED?0:.75,ease:'power3.out',overwrite:'auto'});
    const next=p<.33?0:p<.67?1:2;
    if(next!==phase){
      phase=next;
      gsap.to(caption,{autoAlpha:0,y:-3,duration:REDUCED?0:.22,ease:'power3.out',overwrite:true,onComplete:()=>{
        caption.textContent=words[phase];
        document.getElementById('phase-index').textContent=String(phase+1).padStart(2,'0');
        gsap.fromTo(caption,{autoAlpha:0,y:4},{autoAlpha:1,y:0,duration:REDUCED?0:.55,ease:'power3.out'});
      }});
    }
    stage.dataset.phase=String(next+1);
  }

  fitArtwork();
  try{
    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(BASE_FOV,innerWidth/innerHeight,.1,60);
    renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'low-power'});
    renderer.outputEncoding=THREE.sRGBEncoding;
    renderer.setClearColor(0x000000,0);
    renderer.toneMapping=THREE.NoToneMapping;
    const loader=new THREE.TextureLoader();
    loader.load('/assets/mumbai/life-in-mumbai.jpg',texture=>{
      texture.encoding=THREE.sRGBEncoding;
      texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
      texture.minFilter=THREE.LinearMipmapLinearFilter;
      texture.magFilter=THREE.LinearFilter;
      const geometry=new THREE.PlaneGeometry(4,6,96,144);
      const positions=geometry.attributes.position,uv=geometry.attributes.uv;
      for(let i=0;i<positions.count;i++){
        const u=uv.getX(i),v=uv.getY(i),lower=1-v;
        // The central vanishing lane is farther away; the facades sit nearer.
        const leftBoundary=.33+.105*lower;
        const rightBoundary=.69-.16*lower;
        const left=1-smooth(leftBoundary-.018,leftBoundary+.025,u);
        const right=smooth(rightBoundary-.025,rightBoundary+.018,u);
        const facade=Math.max(left,right);
        const streetDepth=-2.1+1.25*lower;
        const facadeDepth=.35+.65*lower+(right>.5?.12:0);
        const edge=smooth(0,.045,Math.min(u,1-u))*smooth(0,.07,Math.min(v,1-v));
        const depth=(streetDepth*(1-facade)+facadeDepth*facade)*edge;
        // Inverse projection preserves the exact image at the neutral viewpoint.
        // Only the camera moves: the artwork never ripples, tears or regenerates.
        const projection=(BASE_Z-depth)/BASE_Z;
        positions.setXYZ(i,positions.getX(i)*projection,positions.getY(i)*projection,depth);
      }
      geometry.computeVertexNormals();
      const material=new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false,toneMapped:false});
      material.onBeforeCompile=shader=>{
        shader.fragmentShader=shader.fragmentShader.replace('#include <dithering_fragment>',`#include <dithering_fragment>
          float edgeFade=smoothstep(0.0,0.012,vUv.x)*smoothstep(0.0,0.012,1.0-vUv.x);
          gl_FragColor.a*=edgeFade;
        `);
      };
      artwork=new THREE.Mesh(geometry,material);
      scene.add(artwork);
      fitArtwork();
      stage.classList.add('webgl-ready');
      stage.dataset.ready='true';
      canvas.dataset.source='640x960-original-jpeg';
      send({ready:true});
      requestAnimationFrame(render);
    },undefined,error=>{stage.dataset.fallback='true';console.error('Mumbai artwork could not load',error);});
  }catch(error){stage.dataset.fallback='true';console.error('Mumbai depth unavailable',error);}

  function render(t){
    requestAnimationFrame(render);
    if(document.hidden||(!active&&!firstFrame))return;
    if(innerWidth<700&&t-lastFrame<32&&!firstFrame)return;
    lastFrame=t;firstFrame=false;
    const z=BASE_Z-(REDUCED?0:motion.progress*.9);
    camera.position.set(REDUCED?0:motion.x,REDUCED?0:motion.y,z);
    // A restrained dolly zoom changes the relationship of the buildings and lane
    // while keeping the image's overall size stable and its detail intact.
    camera.fov=2*THREE.MathUtils.radToDeg(Math.atan(BASE_Z/z*Math.tan(THREE.MathUtils.degToRad(BASE_FOV/2))));
    camera.updateProjectionMatrix();
    camera.lookAt(0,0,-.45);
    renderer.render(scene,camera);
  }

  addEventListener('resize',fitArtwork);
  addEventListener('pointermove',e=>{
    if(REDUCED||innerWidth<700)return;
    gsap.to(motion,{x:(e.clientX/innerWidth-.5)*.24,y:-(e.clientY/innerHeight-.5)*.10,duration:1.7,ease:'power3.out',overwrite:'auto'});
  },{passive:true});
  addEventListener('pointerleave',()=>gsap.to(motion,{x:0,y:0,duration:2,ease:'power3.out'}));

  if(EMBED){
    addEventListener('message',e=>{
      if(e.source!==parent||e.origin!==location.origin||!e.data?.mumbaiAlleyParent)return;
      if(Number.isFinite(e.data.progress))updateProgress(e.data.progress);
      if(typeof e.data.active==='boolean')active=e.data.active;
    });
    addEventListener('wheel',e=>{e.preventDefault();send({wheel:e.deltaY});},{passive:false});
    let previousY=0;
    addEventListener('touchstart',e=>previousY=e.touches[0].clientY,{passive:true});
    addEventListener('touchmove',e=>{const y=e.touches[0].clientY;send({wheel:previousY-y});previousY=y;e.preventDefault();},{passive:false});
  }else{
    active=true;
    // The standalone file offers the same three phases for quick local review.
    let previewProgress=0;
    addEventListener('wheel',e=>{e.preventDefault();previewProgress=Math.max(0,Math.min(1,previewProgress+e.deltaY*.00045));updateProgress(previewProgress);},{passive:false});
  }
})();
</script>
</body>
</html>
