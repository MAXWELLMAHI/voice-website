<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life in Mumbai — Into the Night</title>
<link rel="stylesheet" href="/assets/site-typography.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#071c22;color:#f4ead4}body{overscroll-behavior-x:none}body.embedded{height:100%;overflow:clip}
.journey-scroll{height:680svh}.embedded .journey-scroll{display:none}.stage{position:fixed;inset:0;overflow:clip;isolation:isolate;background:#0a3039}
.fallback,canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.fallback{object-fit:cover;object-position:50% 50%;transition:opacity .6s}.webgl-ready .fallback{opacity:0}canvas{z-index:1}
.veil{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,#04121666,transparent 24%,transparent 70%,#041216bd),radial-gradient(ellipse at 50% 52%,transparent 32%,#0412164d 100%)}
.annotation,.coordinates,.journey-hint,.chapter{position:absolute;z-index:4;pointer-events:none}.annotation{left:clamp(24px,3.5vw,64px);top:clamp(24px,4vh,48px);font:400 clamp(13px,1.1vw,17px) 'Borel',cursive;color:#f4ead4}
.coordinates{right:clamp(24px,3.5vw,64px);top:clamp(27px,4.5vh,52px);font:8px/1.8 'ABeeZee',sans-serif;letter-spacing:.19em;text-align:right;color:#e3e4d2a6;text-transform:uppercase}
.journey-hint{left:clamp(24px,3.5vw,64px);bottom:clamp(28px,5vh,60px);display:flex;align-items:center;gap:14px;font:8px 'ABeeZee',sans-serif;letter-spacing:.18em;color:#e8e4d5ba}.journey-hint:before{content:'↓';font-size:18px;letter-spacing:0;color:#e8e4d5}.journey-hint:after{content:'';height:1px;width:48px;background:#e8e4d54d}
.chapter{right:clamp(24px,3.5vw,64px);bottom:clamp(28px,5vh,60px);display:flex;gap:16px;align-items:center;font:9px 'ABeeZee',sans-serif;letter-spacing:.16em;color:#e8e4d5b3}.chapter-track{width:90px;height:1px;background:#e8e4d533}.chapter-fill{width:100%;height:1px;background:#e8e4d5;transform:scaleX(0);transform-origin:left}.chapter-total{color:#e8e4d56b}
.fallback-copy{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none}.fallback-copy h2{margin:0;max-width:85%;font:400 clamp(48px,7.5vw,120px)/.92 'Cormorant SC',Georgia,serif;text-shadow:0 3px 24px #02191c;opacity:0}.fallback-mode .fallback-copy h2{opacity:1}.accessible-copy{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.reduced .fallback-copy{background:#04121688}.reduced .fallback-copy h2{opacity:1;font-size:clamp(38px,6vw,82px);line-height:1.3}.reduced .journey-hint{display:none}
@media(max-width:600px){.coordinates{font-size:6px;letter-spacing:.1em;top:28px}.annotation{font-size:12px;top:25px}.journey-hint{font-size:6px;letter-spacing:.1em;gap:8px;max-width:58%}.journey-hint:after{width:22px}.chapter{gap:8px;font-size:7px}.chapter-track{width:42px}}
@media(prefers-reduced-motion:reduce){.fallback{transition:none}.journey-scroll{height:180svh}}
</style>
</head>
<body>
<div class="journey-scroll" aria-hidden="true"></div>
<main class="stage" id="alley-stage" aria-label="Life in Mumbai: a journey through the city at night">
  <img class="fallback" src="/assets/mumbai/teal-urban-canyon.png" width="1672" height="941" alt="A wide painted Mumbai alley, warm windows and balconies opening onto a deep teal night">
  <canvas id="alley-canvas" aria-hidden="true"></canvas><div class="veil" aria-hidden="true"></div>
  <div class="annotation">Life in Mumbai</div><div class="coordinates">The city stays awake.<br>You don't have to.</div>
  <div class="fallback-copy" aria-hidden="true"><h2 id="fallback-phrase">Sleep well</h2></div>
  <div class="journey-hint">SCROLL TO GO DEEPER</div>
  <div class="chapter" aria-hidden="true"><span id="phase-index">01</span><div class="chapter-track"><div class="chapter-fill"></div></div><span class="chapter-total">/ 03</span></div>
  <div class="accessible-copy"><h1>Life in Mumbai</h1><p>Sleep well. Respect your body. Don't pull up.</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(()=>{
  'use strict';
  const EMBED=new URLSearchParams(location.search).has('embed'),REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Named stills make the requested visual storyboard reproducible without
  // changing the embedded journey or depending on screenshot timing.
  const stillProgress=EMBED?undefined:({sleep:.19,respect:.51,deeper:.85})[new URLSearchParams(location.search).get('still')];
  document.body.classList.toggle('embedded',EMBED||typeof stillProgress==='number');
  const stage=document.getElementById('alley-stage'),canvas=document.getElementById('alley-canvas');
  const fallbackPhrase=document.getElementById('fallback-phrase'),phaseIndex=document.getElementById('phase-index'),fill=document.querySelector('.chapter-fill');
  const words=['Sleep well','Respect your body',"Don't pull up"],target={progress:0,x:0,y:0},motion={progress:0,x:0,y:0};
  const ART_ASPECT=1672/941,FOV=48,TRAVEL=38,layers=[],phrases=[];
  let active=!EMBED,renderer,scene,camera,lastTime=0,lastRendered=0,phase=-1,dirty=true;
  const send=data=>{if(EMBED)parent.postMessage({mumbaiAlley:true,...data},location.origin);};
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a));return t*t*(3-2*t);};
  // Six depth bands share a continuous surface. Inverse projection makes the
  // entry match the original exactly, without repeated photographs or seams.
  const depthBands=[[0,120],[.06,76],[.18,44],[.33,28],[.55,17],[1,9]];
  function artworkDepth(u,v){
    const lower=1-v,left=.442+.049*lower,right=.590-.062*lower;
    const facade=clamp(Math.max((left-u)/left,(u-right)/(1-right),0));
    for(let i=1;i<depthBands.length;i++){
      const [a,far]=depthBands[i-1],[b,near]=depthBands[i];
      if(facade<=b){const t=smooth(a,b,facade);return far+(near-far)*t;}
    }
    return 9;
  }
  const beats=[
    {text:'Sleep well',lines:['Sleep well'],depth:20,begin:.035,peak:.19,end:.32,width:.54},
    {text:'Respect your body',lines:['Respect','your body'],depth:30,begin:.36,peak:.51,end:.66,width:.58},
    {text:"Don't pull up",lines:["Don't",'pull up'],depth:49,begin:.70,peak:.85,end:1,width:.54}
  ];
  function setProgress(value){
    target.progress=clamp(value);dirty=true;
    const next=target.progress<.335?0:target.progress<.675?1:2;
    if(next!==phase){phase=next;phaseIndex.textContent=String(next+1).padStart(2,'0');if(!REDUCED)fallbackPhrase.textContent=words[next];stage.dataset.phase=String(next+1);}
    fill.style.transform=`scaleX(${target.progress})`;
  }
  function fitScene(){
    dirty=true;if(!renderer)return;
    const aspect=innerWidth/innerHeight;
    camera.aspect=aspect;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.5:2));renderer.setSize(innerWidth,innerHeight);
    layers.forEach(({mesh})=>{
      const height=2*120*Math.tan(FOV*Math.PI/360)*Math.max(1,aspect/ART_ASPECT),width=height*ART_ASPECT;
      const positions=mesh.geometry.attributes.position,uv=mesh.geometry.attributes.uv;
      for(let i=0;i<positions.count;i++){
        const u=uv.getX(i),v=uv.getY(i),depth=artworkDepth(u,v);
        positions.setXYZ(i,(u-.5)*width*depth/120,(v-.5)*height*depth/120,-depth);
      }
      positions.needsUpdate=true;mesh.geometry.computeBoundingSphere();
    });
    phrases.forEach(({mesh,beat,textureAspect})=>{
      const distance=beat.depth-TRAVEL*beat.peak;
      const width=2*distance*Math.tan(FOV*Math.PI/360)*aspect*(innerWidth<700?.88:beat.width);
      mesh.scale.set(width,width/textureAspect,1);
    });
    canvas.dataset.pixelRatio=String(renderer.getPixelRatio());
  }
  function phraseTexture(beat){
    const art=document.createElement('canvas');art.width=2048;art.height=beat.lines.length===1?470:1000;
    const ctx=art.getContext('2d');ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f5ecd8';
    let size=380;ctx.font=`400 ${size}px 'Cormorant SC'`;
    while(Math.max(...beat.lines.map(line=>ctx.measureText(line).width))>art.width*.92){size-=4;ctx.font=`400 ${size}px 'Cormorant SC'`;}
    beat.lines.forEach((line,i)=>ctx.fillText(line,art.width/2,art.height/2+(i-(beat.lines.length-1)/2)*size*.91));
    const texture=new THREE.CanvasTexture(art);texture.encoding=THREE.sRGBEncoding;texture.minFilter=THREE.LinearFilter;
    return {texture,aspect:art.width/art.height};
  }
  function fallback(){stage.classList.add('fallback-mode');stage.dataset.fallback='true';send({ready:true});}
  async function init(){
    if(REDUCED){stage.classList.add('reduced');fallbackPhrase.innerHTML='Sleep well<br>Respect your body<br>Don’t pull up';stage.dataset.ready='reduced';send({ready:true});return;}
    try{
      if(typeof THREE==='undefined')throw new Error('Scene library unavailable');
      scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(FOV,innerWidth/innerHeight,.1,300);
      renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'low-power'});renderer.outputEncoding=THREE.sRGBEncoding;renderer.setClearColor(0x0a3039,1);
      const texture=await new Promise((resolve,reject)=>new THREE.TextureLoader().load('/assets/mumbai/teal-urban-canyon.png',resolve,undefined,reject));
      texture.encoding=THREE.sRGBEncoding;texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
      const material=new THREE.MeshBasicMaterial({map:texture,depthWrite:true,toneMapped:false,side:THREE.DoubleSide});
      const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1,256,160),material);mesh.frustumCulled=false;scene.add(mesh);layers.push({mesh});
      await document.fonts.load("400 120px 'Cormorant SC'");
      for(const beat of beats){
        const {texture,aspect}=phraseTexture(beat),material=new THREE.MeshBasicMaterial({map:texture,transparent:true,opacity:0,depthWrite:false,depthTest:true,toneMapped:false});
        const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),material);mesh.position.set(0,.1,-beat.depth);scene.add(mesh);phrases.push({mesh,beat,textureAspect:aspect});
      }
      fitScene();stage.classList.add('webgl-ready');stage.dataset.ready='true';stage.dataset.layers=String(depthBands.length);canvas.dataset.source='1672x941-landscape';send({ready:true});requestAnimationFrame(render);
    }catch(error){console.warn('Mumbai depth scene:',error);fallback();}
  }
  function render(now){
    requestAnimationFrame(render);const dt=Math.min((now-lastTime)/1000||.016,.08);lastTime=now;
    if(document.hidden||!active)return;if(innerWidth<700&&now-lastRendered<32)return;
    const damp=1-Math.exp(-dt*7.5),moving=Math.abs(target.progress-motion.progress)+Math.abs(target.x-motion.x)+Math.abs(target.y-motion.y)>.0001;
    if(!moving&&!dirty)return;
    motion.progress+=(target.progress-motion.progress)*damp;motion.x+=(target.x-motion.x)*damp;motion.y+=(target.y-motion.y)*damp;
    const travel=motion.progress*TRAVEL;
    camera.position.set(motion.x+Math.sin(motion.progress*Math.PI*1.4)*.09,motion.y,-travel);camera.lookAt(motion.x*.15,0,-travel-90);
    let visibleText='';phrases.forEach(({mesh,beat})=>{
      const opacity=smooth(beat.begin,beat.peak-.035,motion.progress)*(1-smooth(beat.peak+.035,beat.end,motion.progress));
      mesh.material.opacity=opacity;mesh.visible=opacity>.002&&beat.depth-travel>.4;if(opacity>.5)visibleText=beat.text;
    });
    stage.dataset.progress=motion.progress.toFixed(3);stage.dataset.travel=travel.toFixed(2);stage.dataset.phrase=visibleText;renderer.render(scene,camera);dirty=false;lastRendered=now;
  }
  addEventListener('resize',fitScene);
  addEventListener('pointermove',event=>{if(REDUCED||innerWidth<700)return;target.x=(event.clientX/innerWidth-.5)*.20;target.y=-(event.clientY/innerHeight-.5)*.12;dirty=true;},{passive:true});
  document.addEventListener('pointerleave',()=>{target.x=target.y=0;dirty=true;});
  if(EMBED){
    addEventListener('message',event=>{
      if(event.source!==parent||event.origin!==location.origin||!event.data?.mumbaiAlleyParent)return;
      if(Number.isFinite(event.data.progress))setProgress(event.data.progress);if(typeof event.data.active==='boolean'){active=event.data.active;dirty=true;}
    });
    addEventListener('wheel',event=>{event.preventDefault();send({wheel:event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?innerHeight:1)});},{passive:false});
    let previousY=0;addEventListener('touchstart',event=>{if(event.touches.length===1)previousY=event.touches[0].clientY;},{passive:true});
    addEventListener('touchmove',event=>{if(event.touches.length!==1)return;const y=event.touches[0].clientY;send({wheel:previousY-y});previousY=y;event.preventDefault();},{passive:false});
    addEventListener('keydown',event=>{const amount={ArrowDown:80,ArrowUp:-80,PageDown:innerHeight*.8,PageUp:-innerHeight*.8,' ':innerHeight*.8}[event.key];if(amount!==undefined){event.preventDefault();send({wheel:event.shiftKey&&event.key===' '?-amount:amount});}});
  }else if(typeof stillProgress!=='number'){const update=()=>setProgress(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight));addEventListener('scroll',update,{passive:true});update();}
  setProgress(typeof stillProgress==='number'?stillProgress:0);init();
})();
</script>
</body>
</html>
